options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # ---------- Build container ----------
  # --pull guarantees a fresh base image: the runtime patch level must not
  # depend on cached layers from earlier builds.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '--pull',
        '-t',
        'us-east1-docker.pkg.dev/dtk-prod-core/app-repo/dtk-app-prod:$COMMIT_SHA',
        '.'
      ]

  # ---------- Push to Artifact Registry ----------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'us-east1-docker.pkg.dev/dtk-prod-core/app-repo/dtk-app-prod:$COMMIT_SHA'
      ]

  # ---------- Deploy to Cloud Run (staged, no traffic) ----------
  # The traffic tag is unique per build so concurrent builds cannot verify
  # one revision and promote another through a shared tag.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'dtk-app-prod',
        '--image',
        'us-east1-docker.pkg.dev/dtk-prod-core/app-repo/dtk-app-prod:$COMMIT_SHA',
        '--region',
        'us-east1',
        '--platform',
        'managed',
        '--service-account',
        '1029275239454-compute@developer.gserviceaccount.com',
        '--vpc-connector',
        'dtk-vpc-prod',
        '--add-cloudsql-instances',
        'dtk-prod-core:us-east1:dtk-sql-prod',
        '--no-traffic',
        '--tag',
        'staged-${BUILD_ID}',
        '--quiet'
      ]

  # ---------- Verify staged revision before any production traffic ----------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      [
        'scripts/verify-staged.sh',
        'https://staged-${BUILD_ID}---dtk-app-prod-6y7s3km7ra-ue.a.run.app'
      ]

  # ---------- Promote: route 100% traffic to the verified revision ----------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      [
        'scripts/promote-staged.sh',
        'dtk-app-prod',
        'us-east1',
        'staged-${BUILD_ID}'
      ]

  # ---------- Ensure integration event worker schedule (idempotent) ----------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      [
        'scripts/provision-integration-worker.sh'
      ]

  # ---------- Ensure Ask usage telemetry retention schedule (idempotent) ----------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      [
        'scripts/provision-ask-usage-worker.sh'
      ]

images:
  - us-east1-docker.pkg.dev/dtk-prod-core/app-repo/dtk-app-prod:$COMMIT_SHA
