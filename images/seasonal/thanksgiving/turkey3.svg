  <g stroke="#d97706" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M102 182 L 98 202"/>
    <path d="M128 184 L 132 202"/>
  </g>
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5">
    <path d="M86 198 h20 l-3 10 h-14 Z"/>
    <path d="M122 200 h20 l-3 10 h-14 Z"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5">
    <path d="M88 200 l4 4 M94 200 l4 4 M100 200 l4 4"/>
    <path d="M124 202 l4 4 M130 202 l4 4 M136 202 l4 4"/>
