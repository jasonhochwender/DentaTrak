    <path d="M96 100 C 60 64, 40 66, 30 82 C 52 86, 58 96, 62 108 C 44 104, 30 110, 26 122 C 48 122, 58 128, 64 138 C 78 126, 88 116, 98 110 Z" fill="#14b8a6"/>
