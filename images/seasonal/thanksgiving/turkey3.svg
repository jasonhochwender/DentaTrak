  <!-- body -->
  <ellipse cx="118" cy="144" rx="48" ry="42" fill="#57534e"/>
  <ellipse cx="118" cy="154" rx="36" ry="30" fill="#78716c" opacity="0.7"/>
  <!-- wing -->
  <ellipse cx="138" cy="150" rx="22" ry="16" fill="#44403c" transform="rotate(-18 138 150)"/>
  <path d="M126 142 q 13 -5 24 2 M128 152 q 11 -4 20 2" stroke="#292524" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- neck -->
  <path d="M146 122 C 154 104, 156 92, 160 80 L 174 86 C 170 100, 168 114, 164 128 Z" fill="#57534e"/>
  <!-- head -->
  <circle cx="170" cy="72" r="18" fill="#78716c"/>
  <!-- beak -->
  <path d="M186 66 L 204 72 L 186 79 Z" fill="#fb923c"/>
  <path d="M188 77 L 201 79 L 188 82 Z" fill="#ea580c"/>
  <!-- snood -->
  <path d="M184 84 C 190 96, 186 108, 177 111 C 183 99, 181 90, 175 85 Z" fill="#dc2626"/>
  <!-- googly eye (one big, one small = goofy) -->
  <circle cx="172" cy="66" r="5" fill="#fff"/>
  <circle cx="173.5" cy="66" r="2.4" fill="#1c1917"/>
  <circle cx="160" cy="68" r="3" fill="#fff"/>
  <circle cx="160.8" cy="68" r="1.5" fill="#1c1917"/>
  <!-- tiny orange scarf -->
  <path d="M150 96 q 14 10 30 2 l -2 10 q -14 8 -28 -2 Z" fill="#f97316"/>
  <path d="M162 104 l 4 16 l 5 -3 l -3 -14 Z" fill="#ea580c"/>
