    <path d="M108 96 C 88 58, 74 56, 64 68 C 80 76, 86 86, 90 98 C 78 94, 68 98, 64 108 C 80 110, 88 116, 94 126 C 102 116, 108 108, 112 104 Z" fill="#0ea5e9"/>
    <path d="M114 100 C 96 66, 86 64, 78 74 C 92 82, 98 92, 102 104 C 92 100, 84 104, 80 114 C 94 116, 102 122, 108 132 C 114 120, 118 112, 120 108 Z" fill="#f97316"/>
    <path d="M120 108 C 112 80, 106 76, 100 82 C 110 90, 114 100, 116 112 C 110 108, 104 110, 102 118 C 112 120, 118 126, 122 136 C 128 124, 130 116, 130 112 Z" fill="#84cc16"/>
