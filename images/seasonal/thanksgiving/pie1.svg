<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <defs>
    <clipPath id="pieClip">
      <path d="M 36 150 C 38 106, 126 106, 128 150 Z"/>
    </clipPath>
  </defs>
  <!-- ================= WHOLE PIE (lattice top) ================= -->
  <g>
    <!-- subtle warm plate -->
    <ellipse cx="82" cy="163" rx="72" ry="11" fill="#f5f5f4"/>
    <!-- pie tin rim peeking below the crust -->
    <ellipse cx="82" cy="151" rx="58" ry="9" fill="#d9c29a"/>
    <!-- thick orange filling dome -->
    <path id="pieDome" d="M 36 150 C 38 106, 126 106, 128 150 Z" fill="#f97316"/>
    <!-- subtle dimensional shading on the filling -->
    <ellipse cx="82" cy="142" rx="30" ry="9" fill="#ea580c" opacity="0.35"/>
    <!-- golden lattice strips over the filling -->
    <g clip-path="url(#pieClip)" stroke="#d97706" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M 20 172 L 152 88"/>
      <path d="M 46 178 L 168 96"/>
      <path d="M 72 182 L 182 108"/>
      <path d="M 20 88 L 152 172"/>
      <path d="M 46 96 L 168 180"/>
      <path d="M 72 108 L 182 186"/>
    </g>
    <!-- crimped crust edge along the bottom rim -->
    <g fill="#d97706">
      <circle cx="46" cy="149" r="6"/><circle cx="60" cy="151" r="6"/>
      <circle cx="74" cy="152" r="6"/><circle cx="88" cy="152" r="6"/>
      <circle cx="102" cy="151" r="6"/><circle cx="116" cy="149" r="6"/>
    </g>
    <!-- single whipped cream dollop: stacked swirl -->
    <g fill="#fff7ed">
      <circle cx="82" cy="116" r="10"/>
      <circle cx="76" cy="126" r="8"/>
      <circle cx="88" cy="126" r="8"/>
      <circle cx="82" cy="133" r="7"/>
      <circle cx="82" cy="108" r="5"/>
    </g>
    <path d="M77 104 q 5 -5 10 0" stroke="#fed7aa" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- ================= PIE SLICE ================= -->
  <g>
    <!-- subtle plate -->
    <ellipse cx="190" cy="162" rx="50" ry="9" fill="#f5f5f4"/>
    <!-- crust: larger golden triangle behind the filling -->
    <path d="M 190 88 L 146 150 L 234 150 Z" fill="#d97706"/>
    <!-- filling: inset orange triangle, slightly lighter top face -->
    <path d="M 190 96 L 154 146 L 226 146 Z" fill="#f97316"/>
    <path d="M 190 96 L 172 122 L 208 122 Z" fill="#fdba74" opacity="0.85"/>
    <!-- crust edge definition -->
    <path d="M 190 96 L 154 146 M 190 96 L 226 146" stroke="#92400e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- tiny cream dollop on the apex -->
    <circle cx="190" cy="88" r="7" fill="#fff7ed"/>
    <circle cx="190" cy="81" r="4.5" fill="#fff7ed"/>
  </g>
  <!-- leaf accents -->
  <path d="M 152 66 q 12 -8 18 2 q -11 10 -18 -2 Z" fill="#16a34a"/>
  <path d="M 60 88 q -12 -7 -17 1 q 11 9 17 -1 Z" fill="#65a30d"/>
</svg>
