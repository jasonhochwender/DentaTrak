<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <!-- horn body: curved cone opening to upper right -->
  <path d="M30 160 C 20 110, 50 60, 110 40 C 150 28, 195 40, 215 75 C 228 100, 220 140, 185 160 C 140 185, 70 190, 30 160 Z" fill="#d9a066"/>
  <path d="M30 160 C 20 110, 50 60, 110 40 C 150 28, 195 40, 215 75 C 228 100, 220 140, 185 160 C 140 185, 70 190, 30 160 Z" fill="none" stroke="#b07a45" stroke-width="4"/>
  <!-- wicker weave lines -->
  <g stroke="#b07a45" stroke-width="3" fill="none" opacity="0.6">
    <path d="M55 130 C 70 100, 100 75, 140 60"/>
    <path d="M48 148 C 70 120, 105 95, 150 78"/>
    <path d="M60 112 C 80 88, 110 68, 145 55"/>
    <path d="M75 165 C 95 140, 125 118, 160 100"/>
    <path d="M105 178 C 125 155, 155 135, 185 118"/>
  </g>
  <!-- horn rim opening -->
  <ellipse cx="205" cy="72" rx="34" ry="22" fill="#8b5a2b" transform="rotate(-25 205 72)"/>
  <ellipse cx="205" cy="72" rx="26" ry="15" fill="#5d3a17" transform="rotate(-25 205 72)"/>
  <!-- overflowing produce -->
  <!-- pumpkin -->
  <g>
    <ellipse cx="222" cy="52" rx="20" ry="16" fill="#f97316"/>
    <path d="M214 40 q 2 -8 8 -8 q 6 0 8 8" fill="#65a30d"/>
    <path d="M218 38 q -4 14 0 28 M226 38 q 4 14 0 28" stroke="#c2410c" stroke-width="2" fill="none"/>
  </g>
  <!-- corn cob -->
  <g transform="rotate(20 160 30)">
    <rect x="140" y="8" width="16" height="46" rx="8" fill="#fbbf24"/>
    <path d="M142 14 h12 M142 22 h12 M142 30 h12 M142 38 h12" stroke="#d97706" stroke-width="2"/>
    <path d="M148 54 q 0 10 -4 16 M152 54 q 2 10 6 14" stroke="#65a30d" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- grapes cluster -->
  <g fill="#8b5cf6">
    <circle cx="178" cy="34" r="9"/><circle cx="190" cy="40" r="9"/><circle cx="170" cy="44" r="9"/>
    <circle cx="184" cy="52" r="9"/><circle cx="196" cy="56" r="8"/><circle cx="176" cy="60" r="8"/>
  </g>
  <path d="M186 24 q 6 -10 14 -10" stroke="#65a30d" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- butternut squash -->
  <ellipse cx="150" cy="66" rx="18" ry="12" fill="#facc15" transform="rotate(-15 150 66)"/>
  <path d="M140 60 q 4 -6 10 -6" stroke="#65a30d" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- apple -->
  <circle cx="120" cy="52" r="13" fill="#dc2626"/>
  <path d="M120 40 q 2 -6 8 -8" stroke="#65a30d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="116" cy="46" rx="4" ry="6" fill="#fca5a5" opacity="0.7"/>
  <!-- wheat stalks -->
  <g stroke="#d97706" stroke-width="3" fill="none">
    <path d="M238 90 q 8 -20 4 -40 M244 92 q 10 -18 8 -36"/>
  </g>
  <g fill="#fbbf24">
    <ellipse cx="242" cy="46" rx="4" ry="8" transform="rotate(20 242 46)"/>
    <ellipse cx="252" cy="54" rx="4" ry="8" transform="rotate(35 252 54)"/>
  </g>
</svg>
