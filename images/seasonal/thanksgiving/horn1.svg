<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <defs>
    <clipPath id="hornClip">
      <path d="M46 138 C 58 158, 106 170, 152 158 C 184 150, 204 120, 207 88 L 199 50 C 158 36, 104 44, 76 62 C 56 74, 46 102, 46 122 C 47 131, 45 136, 44 140 Z"/>
    </clipPath>
  </defs>
  <!-- cornucopia: short, wide, rounded wicker horn; mouth upper-right, curled tail lower-left -->
  <path d="M46 138 C 58 158, 106 170, 152 158 C 184 150, 204 120, 207 88 L 199 50 C 158 36, 104 44, 76 62 C 56 74, 46 102, 46 122 C 47 131, 45 136, 44 140 Z" fill="#d9a066"/>
  <path d="M46 138 C 58 158, 106 170, 152 158 C 184 150, 204 120, 207 88 L 199 50 C 158 36, 104 44, 76 62 C 56 74, 46 102, 46 122 C 47 131, 45 136, 44 140 Z" fill="none" stroke="#b07a45" stroke-width="4"/>
  <!-- small curled tapered tail tip -->
  <path d="M45 136 q -8 2 -10 -7 q -2 -8 6 -10 q 7 -1 8 6" fill="none" stroke="#b07a45" stroke-width="6" stroke-linecap="round"/>
  <!-- wicker weave: diagonal strands + rings, clipped to the basket -->
  <g clip-path="url(#hornClip)" stroke="#b07a45" stroke-width="2.5" fill="none" opacity="0.55">
    <path d="M30 30 L 140 190 M 55 20 L 170 200 M 80 15 L 200 200"/>
    <path d="M140 20 L 40 190 M 170 30 L 60 200 M 200 40 L 90 200"/>
    <path d="M70 120 Q 90 135, 80 158 M 110 105 Q 132 120, 122 145 M 150 95 Q 172 108, 164 130 M 185 88 Q 202 98, 197 116"/>
  </g>
  <!-- overflowing produce piled behind the rim -->
  <!-- corn cob, angled -->
  <g transform="rotate(-16 116 44)">
    <rect x="107" y="10" width="17" height="54" rx="8" fill="#fbbf24"/>
    <path d="M110 18 h11 M110 27 h11 M110 36 h11 M110 45 h11 M110 54 h11" stroke="#d97706" stroke-width="2"/>
    <path d="M115 64 q 0 12 -5 18 M120 64 q 3 12 8 16" stroke="#65a30d" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- big pumpkin -->
  <g>
    <ellipse cx="140" cy="48" rx="37" ry="28" fill="#f97316"/>
    <path d="M124 28 q 4 20 0 40 M140 24 q 0 24 0 48 M156 28 q -4 20 0 40" stroke="#c2410c" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M140 22 q 1 -10 9 -11 q 6 1 7 10" fill="#65a30d"/>
  </g>
  <!-- grape cluster -->
  <g fill="#8b5cf6">
    <circle cx="198" cy="28" r="10"/><circle cx="211" cy="36" r="10"/><circle cx="189" cy="39" r="10"/>
    <circle cx="203" cy="48" r="10"/><circle cx="215" cy="55" r="9"/><circle cx="194" cy="58" r="9"/>
    <circle cx="207" cy="66" r="8"/>
  </g>
  <path d="M206 16 q 7 -10 15 -10" stroke="#65a30d" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- butternut squash -->
  <ellipse cx="108" cy="80" rx="23" ry="15" fill="#facc15" transform="rotate(-8 108 80)"/>
  <path d="M97 73 q 4 -7 12 -7" stroke="#65a30d" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- pear -->
  <path d="M78 62 C 71 51, 73 39, 83 34 C 93 39, 95 51, 87 62 C 96 70, 93 82, 83 84 C 73 82, 71 70, 78 62 Z" fill="#84cc16"/>
  <path d="M87 41 q 0 -9 7 -11" stroke="#65a30d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- wheat stalks -->
  <g stroke="#d97706" stroke-width="3" fill="none">
    <path d="M228 78 q 8 -22 4 -44 M234 80 q 10 -20 8 -40"/>
  </g>
  <g fill="#fbbf24">
    <ellipse cx="232" cy="30" rx="4" ry="9" transform="rotate(18 232 30)"/>
    <ellipse cx="241" cy="40" rx="4" ry="9" transform="rotate(32 241 40)"/>
  </g>
  <!-- wide mouth rim -->
  <ellipse cx="198" cy="66" rx="40" ry="27" fill="#8b5a2b" transform="rotate(-18 198 66)"/>
  <ellipse cx="198" cy="66" rx="31" ry="19" fill="#5d3a17" transform="rotate(-18 198 66)"/>
  <!-- produce spilling over the front of the rim -->
  <!-- apple -->
  <circle cx="176" cy="88" r="15" fill="#dc2626"/>
  <path d="M176 76 q 2 -7 9 -9" stroke="#65a30d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="171" cy="82" rx="5" ry="7" fill="#fca5a5" opacity="0.7"/>
  <!-- mini pumpkin -->
  <g>
    <ellipse cx="212" cy="94" rx="15" ry="12" fill="#fb923c"/>
    <path d="M206 84 q 2 -6 6 -6 q 5 0 6 6" fill="#65a30d"/>
    <path d="M209 83 q -3 10 0 20 M216 83 q 3 10 0 20" stroke="#c2410c" stroke-width="1.8" fill="none"/>
  </g>
  <!-- scattered autumn leaves -->
  <path d="M66 32 q 14 -9 20 3 q -13 11 -20 -3 Z" fill="#16a34a"/>
  <path d="M222 16 q 11 -7 16 4 q -10 9 -16 -4 Z" fill="#f59e0b"/>
  <path d="M148 18 q 10 -6 14 4 q -9 8 -14 -4 Z" fill="#dc2626"/>
</svg>
