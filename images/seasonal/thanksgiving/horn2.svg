  <g stroke="#a06a35" stroke-width="3" fill="none" opacity="0.6">
    <path d="M185 130 C 170 100, 140 75, 100 60"/>
    <path d="M192 148 C 170 120, 135 95, 90 78"/>
    <path d="M180 112 C 160 88, 130 68, 95 55"/>
    <path d="M165 165 C 145 140, 115 118, 80 100"/>
