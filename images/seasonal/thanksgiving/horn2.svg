  <g fill="#dc2626">
    <circle cx="60" cy="58" r="6"/><circle cx="70" cy="52" r="6"/><circle cx="66" cy="64" r="6"/>
  </g>
  <path d="M66 46 q 2 -6 8 -8" stroke="#65a30d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- leaf -->
  <path d="M150 40 q 14 -8 20 4 q -12 10 -20 -4 Z" fill="#16a34a"/>
  <path d="M150 40 q 10 0 16 4" stroke="#15803d" stroke-width="2" fill="none"/>
