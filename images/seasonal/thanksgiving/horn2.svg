  <path d="M210 160 C 220 110, 190 60, 130 40 C 90 28, 45 40, 25 75 C 12 100, 20 140, 55 160 C 100 185, 170 190, 210 160 Z" fill="none" stroke="#a06a35" stroke-width="4"/>
