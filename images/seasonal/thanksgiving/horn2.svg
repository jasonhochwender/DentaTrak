    <path d="M74 12 h11 M74 20 h11 M74 28 h11 M74 36 h11" stroke="#d97706" stroke-width="2"/>
    <path d="M79 50 q 0 10 -4 15 M83 50 q 2 10 6 13" stroke="#65a30d" stroke-width="4" fill="none" stroke-linecap="round"/>
