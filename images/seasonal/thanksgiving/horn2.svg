  <ellipse cx="35" cy="72" rx="26" ry="15" fill="#4e2f10" transform="rotate(25 35 72)"/>
  <!-- overflowing produce -->
  <!-- mini pumpkin -->
  <g>
    <ellipse cx="18" cy="52" rx="19" ry="15" fill="#fb923c"/>
    <path d="M11 41 q 2 -7 7 -7 q 5 0 7 7" fill="#65a30d"/>
    <path d="M14 39 q -3 13 0 26 M22 39 q 3 13 0 26" stroke="#c2410c" stroke-width="2" fill="none"/>
  </g>
  <!-- corn cob -->
  <g transform="rotate(-25 80 28)">
